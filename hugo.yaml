    enable: true
    title: "About Me"
    content: |
      I am a Mathematical Engineering and Physics student at Universidad CEU San Pablo with interests spanning data science, applied AI, scientific computing, numerical simulation and physical sensing.

      I enjoy building complete systems: defining the problem, collecting or cleaning data, developing interpretable models, validating assumptions, and turning the result into a usable dashboard, application or technical report.

      My current work includes railway structural-health monitoring, airport queue optimisation, race-strategy simulation, IoT sensing, analytics products and experimental thermal research. I am developing this profile for summer 2027 internships in technology, engineering, data, research and quantitative problem-solving.
