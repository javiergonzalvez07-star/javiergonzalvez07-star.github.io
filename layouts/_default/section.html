{{ define "main" }}
<section class="py-5">
  <div class="container" style="max-width: 860px;">
    <div class="row justify-content-center">
      <div class="col-lg-10">

        <header class="mb-5">
          <h1 class="fw-bold mb-2">{{ .Title }}</h1>
          {{ with .Description }}
          <p class="text-muted">{{ . }}</p>
          {{ end }}
        </header>

        {{ range .Pages.ByDate.Reverse }}
        <article class="mb-5 pb-4 border-bottom">
          <h2 class="h3">
            <a href="{{ .RelPermalink }}" class="text-decoration-none">
              {{ .Title }}
            </a>
          </h2>

          {{ if not .Date.IsZero }}<p class="text-muted small">{{ .Date | time.Format ":date_long" }}</p>{{ end }}

          {{ with .Params.summary }}
          <p>{{ . }}</p>
          {{ end }}

          <a href="{{ .RelPermalink }}">{{ i18n "read_article" }} →</a>
        </article>
        {{ end }}

      </div>
    </div>
  </div>
</section>
{{ end }}
