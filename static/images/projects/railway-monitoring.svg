<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Railway structural health monitoring</title>
  <desc id="desc">Stylized railway tracks with sensor signals and a monitoring dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#123e55"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7ee"/>
      <stop offset="1" stop-color="#758b99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1030" cy="110" r="230" fill="#21c7a8" opacity=".08"/>
  <circle cx="120" cy="620" r="280" fill="#3b82f6" opacity=".08"/>

  <g opacity=".23" stroke="#8fd9df" stroke-width="2">
    <path d="M0 130H1200M0 260H1200M0 390H1200M0 520H1200"/>
    <path d="M150 0V675M350 0V675M550 0V675M750 0V675M950 0V675"/>
  </g>

  <g transform="translate(90 80)">
    <text x="0" y="0" fill="#f7fbfd" font-family="Arial, sans-serif" font-size="48" font-weight="700">Railway Structural</text>
    <text x="0" y="58" fill="#f7fbfd" font-family="Arial, sans-serif" font-size="48" font-weight="700">Health Monitoring</text>
    <text x="2" y="104" fill="#9fd7df" font-family="Arial, sans-serif" font-size="22">Sensors  |  Python  |  Interpretable damage  |  Streamlit</text>
  </g>

  <g transform="translate(720 80)" filter="url(#shadow)">
    <rect width="390" height="245" rx="22" fill="#f6fbfc"/>
    <rect x="28" y="28" width="118" height="70" rx="12" fill="#e2f4f1"/>
    <text x="45" y="57" fill="#315365" font-family="Arial, sans-serif" font-size="15">TRACK STATE</text>
    <text x="45" y="84" fill="#159f82" font-family="Arial, sans-serif" font-size="24" font-weight="700">NORMAL</text>
    <rect x="160" y="28" width="202" height="70" rx="12" fill="#edf3f8"/>
    <text x="180" y="57" fill="#315365" font-family="Arial, sans-serif" font-size="15">ACCUMULATED DAMAGE</text>
    <text x="180" y="84" fill="#295b78" font-family="Arial, sans-serif" font-size="24" font-weight="700">18.4%</text>
    <path d="M30 185 C70 168 85 200 120 171 S177 135 212 164 S269 197 305 151 S342 128 362 142" fill="none" stroke="#19a98b" stroke-width="5"/>
    <path d="M30 211 H362" stroke="#b9cbd4" stroke-width="2"/>
    <circle cx="212" cy="164" r="7" fill="#19a98b"/>
  </g>

  <g transform="translate(85 365)">
    <path d="M145 0 L0 310" stroke="url(#rail)" stroke-width="24"/>
    <path d="M530 0 L680 310" stroke="url(#rail)" stroke-width="24"/>
    <g stroke="#8a6547" stroke-width="22">
      <path d="M108 75H566"/>
      <path d="M70 150H606"/>
      <path d="M32 230H646"/>
      <path d="M0 305H680"/>
    </g>
    <g fill="#17b899">
      <rect x="115" y="30" width="62" height="44" rx="8"/>
      <circle cx="146" cy="52" r="9" fill="#eafffa"/>
    </g>
    <path d="M147 27 C173 -8 195 24 221 -11 S272 22 300 -10 S350 15 380 -16" fill="none" stroke="#49e4c3" stroke-width="6"/>
    <circle cx="147" cy="27" r="6" fill="#f7fbfd"/>
  </g>

  <g transform="translate(800 390)" font-family="Arial, sans-serif">
    <rect width="310" height="174" rx="18" fill="#0a2637" stroke="#3f7287" stroke-width="2"/>
    <text x="24" y="38" fill="#9fd7df" font-size="16">INTERPRETABLE MODEL</text>
    <text x="24" y="92" fill="#f7fbfd" font-size="34" font-weight="700">D = .45P + .10T + .45A</text>
    <text x="24" y="134" fill="#77cbbb" font-size="17">physical signals to clear decisions</text>
  </g>
</svg>
